AWSTemplateFormatVersion: '2010-09-09'
Description: Private versioned direct-code artifacts for Cape Fear's live AgentCore Runtime.

Parameters:
  ProjectSlug:
    Type: String
    Default: cape-fear-live-agent
    AllowedPattern: '^[a-z0-9][a-z0-9-]{2,30}$'

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub '${ProjectSlug}-${AWS::AccountId}-${AWS::Region}-artifacts'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration: {Status: Enabled}
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent-artifacts
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 30}
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}
      Tags:
        - {Key: project, Value: CapeFearSurfGuide}
        - {Key: purpose, Value: AgentCoreLiveDirectCodeArtifact}

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource: [!GetAtt ArtifactBucket.Arn, !Sub '${ArtifactBucket.Arn}/*']
            Condition: {Bool: {aws:SecureTransport: false}}

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  ArtifactBucketArn:
    Value: !GetAtt ArtifactBucket.Arn
