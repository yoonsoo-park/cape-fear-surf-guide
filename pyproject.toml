[project]
name = "cape-fear-surf-guide"
version = "0.1.0"
description = "Evidence-backed Cape Fear surf planning with deterministic safety policy and one Strands agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32.0",
  "strands-agents>=1.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["surf"]

[tool.hatch.build.targets.wheel.force-include]
"surf/data/seed.json" = "surf/data/seed.json"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
]
analytics = [
  "duckdb>=1.4.0",
]

[tool.uv]
default-groups = ["dev", "analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
